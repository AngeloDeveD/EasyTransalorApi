name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # SQLite через gorm требует CGO (github.com/mattn/go-sqlite3).
      - name: Install build deps for SQLite
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  scanner-test:
    name: Python scanner tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libmagic1 unar

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest test_scanner -v
