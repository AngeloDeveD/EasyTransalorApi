##
## Кастомный clamd.conf для нашего стека.
## Монтируется в контейнер clamav как /etc/clamav/clamd.conf (read-only).
##
## Зачем он нужен: у clamd по умолчанию StreamMaxLength = 10M. Наш сканер
## стримит файлы в демон через INSTREAM, и при файле крупнее 10 МБ демон
## закрывает сокет — Python ловит "[Errno 32] Broken pipe". Ниже поднимаем
## лимиты до 4 ГБ (см. предупреждение про потолок ниже).
##
## ВАЖНО: clamd режет ЛЮБОЙ размерный параметр на максимуме 4 ГБ. Значения
## больше молча сбрасываются до максимума. Поэтому ставим 4000M (< 4096M),
## чтобы гарантированно не упереться в сброс. Файлы крупнее 4 ГБ ClamAV
## просканировать не сможет — их сканер уводит на ручную проверку.

# --- Базовые директивы (взяты из дефолтного конфига образа, не меняем) ---
LogFile /var/log/clamav/clamd.log
LogTime yes
# Локальный unix-сокет демона (используется init-скриптами образа)
LocalSocket /tmp/clamd.sock
# TCP-порт: по нему ходит и наш сканер, и healthcheck (echo PING | nc :3310)
TCPSocket 3310
# Пользователь, под которым работает демон в образе
User clamav

# --- Поднятые лимиты размеров (потолок ClamAV — 4 ГБ) ---
# Максимальный размер одного файла, который демон возьмётся сканировать.
MaxFileSize 4000M
# Максимальный суммарный объём данных, сканируемый из одного контейнера/архива.
MaxScanSize 4000M
# Ключевой лимит для нашего случая: максимальная длина потока INSTREAM.
# Именно его нехватка (дефолтные 10M) вызывала Broken pipe.
StreamMaxLength 4000M
